name: Palomar preflight

# Palomar's complete reusable verification workflow, run on the commit this
# workflow is started on: the mechanical preflight Palomar asks for before a
# submission. The workflow reference and pipeline_commit name the same
# PalomarSubmission commit.
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to this formalization, as Palomar records it
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ format('{{"comparator_config_path":"comparator.json","authorization_relationship":"{0}"}}', inputs.authorization_relationship) }}
